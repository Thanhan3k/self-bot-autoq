<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Arena & Streak Master</title>
    <!-- Liên kết đến file CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- CỘT TRÁI: QUẢN LÝ CÁ NHÂN & POMODORO -->
    <div class="panel left-panel">
        <h2>✨ Góc Tập Trung & Streak</h2>
        
        <div class="user-card">
            <div class="avatar" id="userAvatar">HL</div>
            <div>
                <h3 id="userName" style="margin: 0 0 5px 0;">Huấn Luyện Viên</h3>
                <span style="font-size: 13px; color: var(--text-muted);">Rank: <strong id="userRank" style="color: #fEE75C;">Tập Sự</strong></span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                Chuỗi Streak 🔥
                <span id="streakCount">5 Ngày</span>
            </div>
            <div class="stat-box">
                Tổng Giờ Focus ⏱️
                <span id="focusMinutes">125 Phút</span>
            </div>
        </div>

        <button class="btn-success" onclick="dailyCheckin()">📅 Điểm Danh Nhận Streak Hôm Nay</button>

        <!-- Đồng hồ Pomodoro -->
        <div class="timer-box" style="margin-top: 20px;">
            <h3>🍅 Phiên Tập Trung (25 Phút)</h3>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <button class="btn-primary" id="timerBtn" onclick="toggleTimer()">Bắt Đầu Focus</button>
        </div>
    </div>

    <!-- CỘT PHẢI: BẢNG XẾP HẠNG (LEADERBOARD) -->
    <div class="panel right-panel">
        <h2>🏆 Bảng Xếp Hạng Server</h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: -5px;">Cập nhật trực tiếp từ file JSON</p>
        
        <ul class="leaderboard-list" id="leaderboardList">
            <!-- Dữ liệu mẫu đổ từ JS -->
        </ul>
    </div>
</div>

<script>
    // Dữ liệu giả lập mô phỏng file JSON
    let dbData = {
        currentUser: {
            name: "Huấn Luyện Viên",
            streak: 5,
            minutes: 125,
            rank: "Học Bá"
        },
        rankings: [
            { name: "Alex (Top 1)", minutes: 1240, streak: 30, rank: "Thần Đồng" },
            { name: "Luna Ngơ Ngác", minutes: 980, streak: 21, rank: "Giáo Sư" },
            { name: "Huấn Luyện Viên", minutes: 125, streak: 5, rank: "Học Bá" },
            { name: "Kuro Neko", minutes: 90, streak: 2, rank: "Tập Sự" }
        ]
    };

    // Load dữ liệu lên giao diện
    function renderApp() {
        document.getElementById('userName').innerText = dbData.currentUser.name;
        document.getElementById('streakCount').innerText = `${dbData.currentUser.streak} Ngày`;
        document.getElementById('focusMinutes').innerText = `${dbData.currentUser.minutes} Phút`;
        document.getElementById('userRank').innerText = dbData.currentUser.rank;

        // Render Leaderboard
        const listEl = document.getElementById('leaderboardList');
        listEl.innerHTML = '';
        
        dbData.rankings.sort((a, b) => b.minutes - a.minutes);

        dbData.rankings.forEach((user, index) => {
            let medal = `<span>#${index + 1}</span>`;
            if (index === 0) medal = '🥇';
            if (index === 1) medal = '🥈';
            if (index === 2) medal = '🥉';

            const li = document.createElement('li');
            li.className = 'leaderboard-item';
            li.innerHTML = `
                <div>
                    <strong class="rank-badge">${medal} ${user.name}</strong>
                    <div style="font-size: 11px; color: var(--text-muted);">🔥 Streak: ${user.streak} ngày | Rank: ${user.rank}</div>
                </div>
                <div style="font-weight: bold; color: var(--accent);">${user.minutes} phút</div>
            `;
            listEl.appendChild(li);
        });
    }

    // Tính năng Điểm danh
    function dailyCheckin() {
        dbData.currentUser.streak += 1;
        alert('🎉 Điểm danh thành công! Chuỗi Streak của bạn đã tăng lên.');
        renderApp();
    }

    // Logic Đồng hồ Pomodoro
    let timerInterval = null;
    let timeLeft = 25 * 60;
    let isRunning = false;

    function toggleTimer() {
        const btn = document.getElementById('timerBtn');
        if (!isRunning) {
            isRunning = true;
            btn.innerText = "Tạm Dừng";
            btn.className = "btn-danger";

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    alert('🎯 Hoàn thành phiên Pomodoro! Bạn được cộng +25 phút vào hồ sơ.');
                    dbData.currentUser.minutes += 25;
                    resetTimer();
                    renderApp();
                }
            }, 1000);
        } else {
            clearInterval(timerInterval);
            isRunning = false;
            btn.innerText = "Tiếp Tục Focus";
            btn.className = "btn-primary";
        }
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timerDisplay').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        timeLeft = 25 * 60;
        document.getElementById('timerBtn').innerText = "Bắt Đầu Focus";
        document.getElementById('timerBtn').className = "btn-primary";
        updateTimerDisplay();
    }

    renderApp();
</script>

</body>
</html>
