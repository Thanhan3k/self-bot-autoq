<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Mining Tycoon & Đua Rank</title>
    <link rel="stylesheet" href="./style.css?v=1">
</head>
<body>

<div class="app-container">
    <!-- CỘT TRÁI: QUẢN LÝ MỎ & NÂNG CẤP -->
    <div class="panel left-panel">
        <h2>⛏️ Mỏ Khoáng Tự Động (Idle)</h2>
        
        <div class="profile-box">
            <div id="loginArea">
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;">Nhập Discord Token để lưu ID & đua rank:</p>
                <input type="password" id="tokenInput" placeholder="Dán token tài khoản...">
                <button class="btn-primary" onclick="loginByToken()">Đăng Nhập Nhanh</button>
            </div>

            <div id="userProfileArea" style="display: none;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div id="userAvatarContainer" style="width: 45px; height: 45px; border-radius: 50%; background: #5865f2; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold;">?</div>
                    <div style="flex: 1; overflow: hidden;">
                        <strong id="displayName" style="color: #fff; display: block; font-size: 15px;">User</strong>
                        <span style="font-size: 12px; color: var(--text-secondary);">Cấp Mỏ: <strong id="displayLevel" style="color: var(--gold);">Cấp 1</strong></span>
                    </div>
                    <button onclick="logoutDiscord()" class="btn-danger" style="width: auto; padding: 6px 10px; font-size: 11px; margin-top:0;">Thoát</button>
                </div>
            </div>
        </div>

        <div class="resource-grid">
            <div class="resource-box">
                💰 Vàng Tích Lũy
                <span id="goldCount">0</span>
            </div>
            <div class="resource-box">
                ⚡ Tốc Độ Đào
                <span id="rateCount">1/giây</span>
            </div>
        </div>

        <button class="btn-success" onclick="collectGold()">📥 Thu Hoạch Vàng AFK</button>
        <button class="btn-gold" onclick="upgradeMine()">🔨 Nâng Cấp Mỏ (Giá: <span id="upgradeCost">50</span> Vàng)</button>
    </div>

    <!-- CỘT PHẢI: BẢNG XẾP HẠNG SERVER -->
    <div class="panel right-panel">
        <h2>🏆 Bảng Xếp Hạng Khai Thác</h2>
        <p id="syncStatus" style="font-size: 12px; color: var(--text-secondary); margin-top: -8px;">Đang tải dữ liệu...</p>
        
        <ul class="leaderboard-list" id="leaderboardList">
            <li style="text-align: center; color: var(--text-secondary); padding: 30px 10px; font-size: 13px;">Đang tải bảng xếp hạng...</li>
        </ul>
    </div>
</div>

<script>
    let serverData = { rankings: [] };
    let currentUser = JSON.parse(localStorage.getItem('discord_idle_user')) || null;

    async function loginByToken() {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token) { alert('Vui lòng nhập Token!'); return; }

        try {
            const res = await fetch('https://discord.com/api/v9/users/@me', {
                headers: { 'Authorization': token }
            });
            if (!res.ok) { alert('Token không hợp lệ!'); return; }
            
            const user = await res.json();
            currentUser = {
                discord_id: user.id,
                username: user.username,
                avatar: user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : null
            };
            localStorage.setItem('discord_idle_user', JSON.stringify(currentUser));
            initPlayer();
            renderUI();
        } catch(e) {
            alert('Lỗi kết nối Discord API!');
        }
    }

    function logoutDiscord() {
        localStorage.removeItem('discord_idle_user');
        location.reload();
    }

    async function loadData() {
        const statusEl = document.getElementById('syncStatus');
        try {
            const res = await fetch(`./data.json?t=${Date.now()}`);
            if (res.ok) {
                serverData = await res.json();
                if (!serverData.rankings) serverData.rankings = [];
                statusEl.innerText = "🟢 Đồng bộ data.json thành công";
            } else {
                statusEl.innerText = "⚪ Chưa có file data.json";
            }
        } catch(e) {
            statusEl.innerText = "⚪ Chế độ ngoại tuyến";
        }

        const localSaved = localStorage.getItem('idle_rankings');
        if (localSaved) {
            serverData.rankings = JSON.parse(localSaved);
        }
        
        if (currentUser) {
            initPlayer();
            calcOfflineProgress();
        }
        renderUI();
    }

    function initPlayer() {
        if (!currentUser) return;
        let p = serverData.rankings.find(u => u.discord_id === currentUser.discord_id);
        if (!p) {
            p = { 
                discord_id: currentUser.discord_id, 
                gold: 0, 
                mine_level: 1, 
                last_time: Date.now() 
            };
            serverData.rankings.push(p);
        }
        saveLocal();
    }

    function saveLocal() {
        localStorage.setItem('idle_rankings', JSON.stringify(serverData.rankings));
    }

    // Tính toán tài nguyên tự động sinh ra kể cả khi tắt web (AFK)
    function calcOfflineProgress() {
        let p = serverData.rankings.find(u => u.discord_id === currentUser.discord_id);
        if (!p) return;

        const now = Date.now();
        const secondsPassed = Math.floor((now - p.last_time) / 1000);
        if (secondsPassed > 0) {
            const earned = secondsPassed * p.mine_level; // Cấp mỏ càng cao đào càng nhanh
            p.gold += earned;
            p.last_time = now;
            saveLocal();
        }
    }

    // Vòng lặp chạy ngầm cộng vàng liên tục mỗi giây khi đang mở web
    setInterval(() => {
        if (!currentUser) return;
        let p = serverData.rankings.find(u => u.discord_id === currentUser.discord_id);
        if (p) {
            p.gold += p.mine_level;
            p.last_time = Date.now();
            saveLocal();
            document.getElementById('goldCount').innerText = p.gold.toLocaleString();
        }
    }, 1000);

    function collectGold() {
        if (!currentUser) { alert('Vui lòng đăng nhập trước!'); return; }
        calcOfflineProgress();
        renderUI();
        alert('📥 Đã thu hoạch toàn bộ vàng khai thác!');
    }

    function upgradeMine() {
        if (!currentUser) { alert('Vui lòng đăng nhập trước!'); return; }
        let p = serverData.rankings.find(u => u.discord_id === currentUser.discord_id);
        const cost = p.mine_level * 50;

        if (p.gold < cost) {
            alert(`❌ Không đủ vàng! Bạn cần ${cost} vàng để nâng cấp.`);
            return;
        }

        p.gold -= cost;
        p.mine_level += 1;
        saveLocal();
        renderUI();
        alert(`🎉 Nâng cấp mỏ thành công lên Cấp ${p.mine_level}!`);
    }

    function renderUI() {
        if (currentUser) {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('userProfileArea').style.display = 'block';
            document.getElementById('displayName').innerText = currentUser.username;
            
            const avatarContainer = document.getElementById('userAvatarContainer');
            if (currentUser.avatar) {
                avatarContainer.innerHTML = `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
            } else {
                avatarContainer.innerText = currentUser.username.substring(0, 2).toUpperCase();
            }

            let p = serverData.rankings.find(u => u.discord_id === currentUser.discord_id);
            if (p) {
                document.getElementById('goldCount').innerText = p.gold.toLocaleString();
                document.getElementById('rateCount').innerText = `${p.mine_level} vàng/s`;
                document.getElementById('displayLevel').innerText = `Cấp ${p.mine_level}`;
                document.getElementById('upgradeCost').innerText = p.mine_level * 50;
            }
        } else {
            document.getElementById('loginArea').style.display = 'block';
            document.getElementById('userProfileArea').style.display = 'none';
        }

        const list = document.getElementById('leaderboardList');
        list.innerHTML = '';
        const sorted = [...serverData.rankings].sort((a,b) => b.mine_level - a.mine_level || b.gold - a.gold);

        if (sorted.length === 0) {
            list.innerHTML = `<li style="text-align: center; color: var(--text-secondary); padding: 30px 10px; font-size: 13px;">Chưa có dữ liệu xếp hạng.</li>`;
            return;
        }

        sorted.forEach((user, index) => {
            let medal = `<span>#${index + 1}</span>`;
            if (index === 0) medal = '🥇';
            if (index === 1) medal = '🥈';
            if (index === 2) medal = '🥉';

            const isMe = currentUser && user.discord_id === currentUser.discord_id;
            const displayName = isMe ? currentUser.username : `Thợ Mỏ #${user.discord_id.slice(-4)}`;
            const displayAvatar = isMe ? currentUser.avatar : null;

            const li = document.createElement('li');
            li.className = 'leaderboard-item';
            li.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: #5865f2; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff;">
                        ${displayAvatar ? `<img src="${displayAvatar}" style="width:100%;height:100%;object-fit:cover;">` : '⛏️'}
                    </div>
                    <div>
                        <strong class="rank-badge">${medal} ${displayName}</strong>
                        <div style="font-size: 11px; color: var(--text-secondary);">Cấp Mỏ: Cấp ${user.mine_level}</div>
                    </div>
                </div>
                <div style="font-weight: bold; color: var(--gold);">${user.gold.toLocaleString()} vàng</div>
            `;
            list.appendChild(li);
        });
    }

    loadData();
</script>

</body>
</html>
