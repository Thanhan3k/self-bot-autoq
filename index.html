<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Sưu Tầm & Đua Rank</title>
    <link rel="stylesheet" href="./style.css?v=1">
</head>
<body>

<div class="app-container">
    <!-- CỘT TRÁI: NHÂN VẬT & GACHA -->
    <div class="panel left-panel">
        <h2>🛡️ Kho Đồ & Đấu Trường Sưu Tầm</h2>
        
        <div class="profile-box">
            <div style="display: flex; gap: 8px;">
                <input type="text" id="inputName" placeholder="Nhập tên chiến thần...">
                <button class="btn-primary" onclick="saveName()" style="width: auto; padding: 0 16px; margin-top:0;">Lưu Tên</button>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--text-secondary);">
                <span>Chiến Thần: <strong id="displayName" style="color: #fff;">Chưa rõ</strong></span>
                <span>Rank: <strong id="displayRank" style="color: var(--gold);">Tập Sự</strong></span>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
            <div style="background: var(--card-inner); padding: 12px; border-radius: 10px; text-align: center;">
                🔑 Chìa Khóa Mở Rương
                <span id="keyCount" style="display: block; font-size: 20px; font-weight: bold; color: var(--gold); margin-top: 4px;">0</span>
            </div>
            <div style="background: var(--card-inner); padding: 12px; border-radius: 10px; text-align: center;">
                ⚔️ Tổng Điểm Sức Mạnh
                <span id="powerScore" style="display: block; font-size: 20px; font-weight: bold; color: var(--primary); margin-top: 4px;">0</span>
            </div>
        </div>

        <button class="btn-success" onclick="dailyCheckin()">📅 Điểm Danh Nhận +2 Chìa Khóa</button>
        <button class="btn-gold" onclick="openChest()">🎁 Mở Rương Kho Báu (-1 Chìa Khóa)</button>

        <!-- Kho đồ hiển thị item -->
        <h3 style="margin-top: 20px;">🎒 Túi Đồ Sưu Tầm</h3>
        <div class="inventory-grid" id="inventoryGrid">
            <div style="grid-column: span 4; text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">Túi đồ trống. Hãy mở rương ngay!</div>
        </div>
    </div>

    <!-- CỘT PHẢI: BẢNG XẾP HẠNG -->
    <div class="panel right-panel">
        <h2>🏆 Bảng Xếp Hạng Sưu Tầm</h2>
        <p id="syncStatus" style="font-size: 12px; color: var(--text-secondary); margin-top: -8px;">Đang tải dữ liệu server...</p>
        
        <ul class="leaderboard-list" id="leaderboardList">
            <!-- Đổ dữ liệu từ data.json -->
        </ul>
    </div>
</div>

<script>
    // Danh sách vật phẩm có thể rớt (Gacha pool)
    const ITEM_POOL = [
        { name: "Kiếm Gỗ", rarity: "common", power: 10 },
        { name: "Giáp Vải", rarity: "common", power: 10 },
        { name: "Khiên Đồng", rarity: "rare", power: 30 },
        { name: "Cung Tinh Linh", rarity: "rare", power: 45 },
        { name: "Kiếm Ánh Sáng", rarity: "epic", power: 100 },
        { name: "Áo Giáp Rồng", rarity: "epic", power: 130 },
        { name: "Đao Hủy Diệt", rarity: "legendary", power: 300 },
        { name: "Vương Miện Tối Thượng", rarity: "legendary", power: 500 }
    ];

    let serverData = { rankings: [] };
    let playerName = localStorage.getItem('collector_name') || "";
    document.getElementById('inputName').value = playerName;

    function saveName() {
        const val = document.getElementById('inputName').value.trim();
        if (!val) { alert('Vui lòng nhập tên!'); return; }
        playerName = val;
        localStorage.setItem('collector_name', playerName);
        initPlayer();
        renderUI();
    }

    function calculateRank(power) {
        if (power >= 1000) return "Thách Đấu 👑";
        if (power >= 500) return "Bạch Kim 💎";
        if (power >= 250) return "Vàng 🥇";
        if (power >= 100) return "Bạc 🥈";
        if (power > 0) return "Đồng 🥉";
        return "Tập Sự";
    }

    // Đọc/Ghi data.json qua GitHub API (Tương tự bản trước để lưu chung server)
    async function loadData() {
        try {
            const res = await fetch(`./data.json?t=${Date.now()}`);
            if (res.ok) {
                serverData = await res.json();
                if (!serverData.rankings) serverData.rankings = [];
                document.getElementById('syncStatus').innerText = "🟢 Đồng bộ thành công";
            }
        } catch(e) {
            document.getElementById('syncStatus').innerText = "⚪ Chế độ cục bộ";
        }
        initPlayer();
        renderUI();
    }

    function initPlayer() {
        if (!playerName) return;
        let p = serverData.rankings.find(u => u.name === playerName);
        if (!p) {
            p = { name: playerName, keys: 3, items: [], power: 0, rank: "Tập Sự", last_checkin: "" };
            serverData.rankings.push(p);
        }
    }

    function dailyCheckin() {
        if (!playerName) { alert('Hãy nhập và lưu tên trước!'); return; }
        const today = new Date().toISOString().split('T')[0];
        let p = serverData.rankings.find(u => u.name === playerName);
        
        if (p.last_checkin === today) {
            alert('Hôm nay bạn đã điểm danh nhận chìa khóa rồi!');
            return;
        }
        p.keys += 2;
        p.last_checkin = today;
        alert('🎉 Điểm danh thành công! Nhận +2 Chìa Khóa.');
        renderUI();
    }

    // Mở Rương Gacha
    function openChest() {
        if (!playerName) { alert('Hãy nhập và lưu tên trước!'); return; }
        let p = serverData.rankings.find(u => u.name === playerName);
        
        if (p.keys <= 0) {
            alert('❌ Bạn đã hết chìa khóa! Hãy điểm danh hằng ngày để nhận thêm.');
            return;
        }

        p.keys -= 1;

        // Random tỉ lệ ra đồ (Common 60%, Rare 25%, Epic 12%, Legendary 3%)
        const rand = Math.random() * 100;
        let chosenRarity = "common";
        if (rand > 97) chosenRarity = "legendary";
        else if (rand > 85) chosenRarity = "epic";
        else if (rand > 60) chosenRarity = "rare";

        const pool = ITEM_POOL.filter(i => i.rarity === chosenRarity);
        const item = pool[Math.floor(Math.random() * pool.length)];

        // Thêm item vào túi đồ
        p.items.push(item);
        
        // Tính lại tổng sức mạnh & rank
        p.power = p.items.reduce((sum, i) => sum + i.power, 0);
        p.rank = calculateRank(p.power);

        alert(`🎁 Chúc mừng! Bạn mở rương nhận được: [${item.name.toUpperCase()}] - Độ hiếm: ${item.rarity.toUpperCase()} (+${item.power} sức mạnh)`);
        renderUI();
    }

    function renderUI() {
        document.getElementById('displayName').innerText = playerName || "Chưa rõ";
        
        if (!playerName) return;
        let p = serverData.rankings.find(u => u.name === playerName);
        if (!p) return;

        document.getElementById('keyCount').innerText = p.keys;
        document.getElementById('powerScore').innerText = p.power;
        document.getElementById('displayRank').innerText = p.rank;

        // Hiển thị túi đồ
        const grid = document.getElementById('inventoryGrid');
        grid.innerHTML = '';
        if (p.items.length === 0) {
            grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">Túi đồ trống. Hãy mở rương ngay!</div>`;
        } else {
            p.items.forEach(item => {
                const div = document.createElement('div');
                div.className = `item-slot rarity-${item.rarity}`;
                div.innerHTML = `<strong>${item.name}</strong><span style="font-size:9px; margin-top:2px;">+${item.power} lực</span>`;
                grid.appendChild(div);
            });
        }

        // Hiển thị Bảng Xếp Hạng
        const list = document.getElementById('leaderboardList');
        list.innerHTML = '';
        const sorted = [...serverData.rankings].sort((a,b) => b.power - a.power);

        sorted.forEach((user, index) => {
            let medal = `<span>#${index + 1}</span>`;
            if (index === 0) medal = '🥇';
            if (index === 1) medal = '🥈';
            if (index === 2) medal = '🥉';

            const li = document.createElement('li');
            li.className = 'leaderboard-item';
            li.innerHTML = `
                <div>
                    <strong class="rank-badge">${medal} ${user.name}</strong>
                    <div style="font-size: 11px; color: var(--text-secondary);">Rank: ${user.rank} | Số món đồ: ${user.items.length}</div>
                </div>
                <div style="font-weight: bold; color: var(--primary);">${user.power} điểm</div>
            `;
            list.appendChild(li);
        });
    }

    loadData();
</script>

</body>
</html>
