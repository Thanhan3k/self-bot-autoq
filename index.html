<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Send Message Discord</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1e1f22;
            color: #dbdee1;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: #2b2d31;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #fff; margin-top: 0; }
        label { display: block; margin-top: 12px; font-size: 14px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #1e1f22;
            background-color: #383a40;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        #startBtn { background-color: #5865f2; }
        #startBtn:disabled { background-color: #4752c4; opacity: 0.6; }
        #stopBtn { background-color: #da373c; }
        #log {
            margin-top: 15px;
            padding: 10px;
            background-color: #1e1f22;
            border-radius: 4px;
            height: 150px;
            overflow-y: auto;
            font-size: 13px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Auto Nhắn Tin Discord</h2>
    
    <label>User Token:</label>
    <input type="password" id="token" placeholder="Dán token tài khoản vào đây">

    <label>ID Kênh Chat (Channel ID):</label>
    <input type="text" id="channelId" placeholder="Ví dụ: 123456789012345678">

    <label>Nội dung tin nhắn:</label>
    <textarea id="message" rows="3" placeholder="Nhập nội dung muốn gửi..."></textarea>

    <label>Thời gian nghỉ (giây):</label>
    <input type="number" id="delay" value="90" min="5">

    <div class="btn-group">
        <button id="startBtn" onclick="startAuto()">Bắt đầu chạy</button>
        <button id="stopBtn" onclick="stopAuto()" disabled>Dừng lại</button>
    </div>

    <div id="log">Sẵn sàng...</div>
</div>

<script>
    let timer = null;

    function addLog(text) {
        const logDiv = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML += `<div>[${time}] ${text}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function sendMessage(token, channelId, content) {
        try {
            const response = await fetch(`https://discord.com/api/v9/channels/${channelId}/messages`, {
                method: 'POST',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ content: content })
            });

            if (response.ok) {
                addLog('✅ Gửi tin nhắn thành công!');
            } else {
                const err = await response.json();
                addLog(`❌ Lỗi (${response.status}): ${err.message || 'Kiểm tra lại Token/ID'}`);
                stopAuto();
            }
        } catch (error) {
            addLog(`⚠️ Lỗi mạng hoặc bị chặn CORS: ${error.message}`);
        }
    }

    function startAuto() {
        const token = document.getElementById('token').value.trim();
        const channelId = document.getElementById('channelId').value.trim();
        const message = document.getElementById('message').value.trim();
        const delaySec = parseInt(document.getElementById('delay').value);

        if (!token || !channelId || !message || isNaN(delaySec) || delaySec < 1) {
            alert('Vui lòng điền đầy đủ thông tin hợp lệ!');
            return;
        }

        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        addLog(`🚀 Bắt đầu chạy (chu kỳ ${delaySec} giây)...`);

        // Gửi tin đầu tiên ngay lập tức
        sendMessage(token, channelId, message);

        // Lặp lại theo chu kỳ
        timer = setInterval(() => {
            sendMessage(token, channelId, message);
        }, delaySec * 1000);
    }

    function stopAuto() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        addLog('🛑 Đã dừng.');
    }
</script>

</body>
</html>
