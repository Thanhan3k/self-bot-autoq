<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Sưu Tầm & Đua Rank</title>
    <link rel="stylesheet" href="./style.css?v=4">
</head>
<body>

<div class="app-container">
    <!-- CỘT TRÁI: NHÂN VẬT & GACHA -->
    <div class="panel left-panel">
        <h2>🛡️ Đấu Trường Sưu Tầm Gacha</h2>
        
        <div class="profile-box">
            <div id="loginArea">
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;">Nhập Discord Token để đăng nhập nhanh:</p>
                <input type="password" id="tokenInput" placeholder="Dán token tài khoản vào đây...">
                <button class="btn-primary" onclick="loginByToken()">Đăng Nhập Bằng Token</button>
            </div>

            <div id="userProfileArea" style="display: none;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div id="userAvatarContainer" style="width: 45px; height: 45px; border-radius: 50%; background: #5865f2; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold;">?</div>
                    <div style="flex: 1; overflow: hidden;">
                        <strong id="displayName" style="color: #fff; display: block; font-size: 15px;">User</strong>
                        <span style="font-size: 12px; color: var(--text-secondary);">Rank: <strong id="displayRank" style="color: var(--gold);">Tập Sự</strong></span>
                    </div>
                    <button onclick="logoutDiscord()" class="btn-danger" style="width: auto; padding: 6px 10px; font-size: 11px; margin-top:0;">Đăng Xuất</button>
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
            <div style="background: var(--card-inner); padding: 12px; border-radius: 10px; text-align: center;">
                🔑 Chìa Khóa Mở Rương
                <span id="keyCount" style="display: block; font-size: 20px; font-weight: bold; color: var(--gold); margin-top: 4px;">0</span>
            </div>
            <div style="background: var(--card-inner); padding: 12px; border-radius: 10px; text-align: center;">
                ⚔️ Tổng Điểm Sức Mạnh
                <span id="powerScore" style="display: block; font-size: 20px; font-weight: bold; color: var(--primary); margin-top: 4px;">0</span>
            </div>
        </div>

        <button class="btn-success" onclick="dailyCheckin()">📅 Điểm Danh Nhận +2 Chìa Khóa</button>
        <button class="btn-gold" onclick="openChest()">🎁 Mở Rương Kho Báu (-1 Chìa Khóa)</button>

        <h3 style="margin-top: 20px;">🎒 Túi Đồ Sưu Tầm</h3>
        <div class="inventory-grid" id="inventoryGrid">
            <div style="grid-column: span 4; text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">Túi đồ trống. Hãy đăng nhập và mở rương!</div>
        </div>
    </div>

    <!-- CỘT PHẢI: BẢNG XẾP HẠNG -->
    <div class="panel right-panel">
        <h2>🏆 Bảng Xếp Hạng Sưu Tầm</h2>
        <p id="syncStatus" style="font-size: 12px; color: var(--text-secondary); margin-top: -8px;">Đang tải dữ liệu...</p>
        
        <ul class="leaderboard-list" id="leaderboardList">
            <li style="text-align: center; color: var(--text-secondary); padding: 30px 10px; font-size: 13px;">Đang tải bảng xếp hạng...</li>
        </ul>
    </div>
</div>

<script>
    const ITEM_POOL = [
        { name: "Kiếm Gỗ", rarity: "common", power: 10 },
        { name: "Giáp Vải", rarity: "common", power: 10 },
        { name: "Khiên Đồng", rarity: "rare", power: 30 },
        { name: "Cung Tinh Linh", rarity: "rare", power: 45 },
        { name: "Kiếm Ánh Sáng", rarity: "epic", power: 100 },
        { name: "Áo Giáp Rồng", rarity: "epic", power: 130 },
        { name: "Đao Hủy Diệt", rarity: "legendary", power: 300 },
        { name: "Vương Miện Tối Thượng", rarity: "legendary", power: 500 }
    ];

    let serverData = { rankings: [] };
    let currentUser = JSON.parse(localStorage.getItem('discord_token_user')) || null;

    async function loginByToken() {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token) { alert('Vui lòng nhập Token!'); return; }

        try {
            const res = await fetch('https://discord.com/api/v9/users/@me', {
                headers: { 'Authorization': token }
            });
            if (!res.ok) { alert('Token không hợp lệ hoặc đã hết hạn!'); return; }
            
            const user = await res.json();
            currentUser = {
                discord_id: user.id,
                username: user.username,
                avatar: user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : null
            };
            localStorage.setItem('discord_token_user', JSON.stringify(currentUser));
            initPlayer();
            renderUI();
        } catch(e) {
            alert('Lỗi kết nối Discord API!');
        }
    }

    function logoutDiscord() {
        localStorage.removeItem('discord_token_user');
        location.reload();
    }

    function calculateRank(power) {
        if (power >= 1000) return "Thách Đấu 👑";
        if (power >= 500) return "Bạch Kim 💎";
        if (power >= 250) return "Vàng 🥇";
        if (power >= 100) return "Bạc 🥈";
        if (power > 0) return "Đồng 🥉";
        return "Tập Sự";
    }

    async function loadData() {
        const statusEl = document.getElementById('syncStatus');
        try {
            const res = await fetch(`./data.json?t=${Date.now()}`);
            if (res.ok) {
                serverData = await res.json();
                if (!serverData.rankings) serverData.rankings = [];
                statusEl.innerText = "🟢 Đã đồng bộ từ data.json";
            } else {
                statusEl.innerText = "⚪ Chế độ cục bộ";
            }
        } catch(e) {
            statusEl.innerText = "⚪ Chế độ ngoại tuyến";
        }

        const localSaved = localStorage.getItem('local_rankings');
        if (localSaved) {
            serverData.rankings = JSON.parse(localSaved);
        }
        initPlayer();
        renderUI();
    }

    function initPlayer() {
        if (!currentUser) return;
        let p = serverData.rankings.find(u => u.discord_id === currentUser.discord_id);
        if (!p) {
            p = { 
                discord_id: currentUser.discord_id, 
                keys: 3, 
                items: [], 
                power: 0, 
                rank: "Tập Sự", 
                last_checkin: "" 
            };
            serverData.rankings.push(p);
        }
        saveLocal();
    }

    function saveLocal() {
        // Chỉ lưu id, items, power, rank, keys, last_checkin (không lưu username hay thông tin cá nhân)
        localStorage.setItem('local_rankings', JSON.stringify(serverData.rankings));
    }

    function dailyCheckin() {
        if (!currentUser) { alert('⚠️ Vui lòng đăng nhập trước!'); return; }
        const today = new Date().toISOString().split('T')[0];
        let p = serverData.rankings.find(u => u.discord_id === currentUser.discord_id);
        
        if (p.last_checkin === today) {
            alert('📅 Hôm nay bạn đã điểm danh rồi!');
            return;
        }
        p.keys += 2;
        p.last_checkin = today;
        saveLocal();
        renderUI();
        alert('🎉 Điểm danh thành công! Nhận +2 Chìa Khóa.');
    }

    function openChest() {
        if (!currentUser) { alert('⚠️ Vui lòng đăng nhập trước!'); return; }
        let p = serverData.rankings.find(u => u.discord_id === currentUser.discord_id);
        
        if (p.keys <= 0) {
            alert('❌ Bạn đã hết chìa khóa!');
            return;
        }

        p.keys -= 1;
        const rand = Math.random() * 100;
        let chosenRarity = "common";
        if (rand > 97) chosenRarity = "legendary";
        else if (rand > 85) chosenRarity = "epic";
        else if (rand > 60) chosenRarity = "rare";

        const pool = ITEM_POOL.filter(i => i.rarity === chosenRarity);
        const item = pool[Math.floor(Math.random() * pool.length)];

        p.items.push(item);
        p.power = p.items.reduce((sum, i) => sum + i.power, 0);
        p.rank = calculateRank(p.power);

        saveLocal();
        renderUI();
        alert(`🎁 Nhận được: [${item.name.toUpperCase()}] (${item.rarity.toUpperCase()}) +${item.power} lực!`);
    }

    function renderUI() {
        if (currentUser) {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('userProfileArea').style.display = 'block';
            document.getElementById('displayName').innerText = currentUser.username;
            
            const avatarContainer = document.getElementById('userAvatarContainer');
            if (currentUser.avatar) {
                avatarContainer.innerHTML = `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
            } else {
                avatarContainer.innerText = currentUser.username.substring(0, 2).toUpperCase();
            }

            let p = serverData.rankings.find(u => u.discord_id === currentUser.discord_id);
            if (p) {
                document.getElementById('keyCount').innerText = p.keys;
                document.getElementById('powerScore').innerText = p.power;
                document.getElementById('displayRank').innerText = p.rank;

                const grid = document.getElementById('inventoryGrid');
                grid.innerHTML = '';
                if (p.items.length === 0) {
                    grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">Túi đồ trống.</div>`;
                } else {
                    p.items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = `item-slot rarity-${item.rarity}`;
                        div.innerHTML = `<strong>${item.name}</strong><span style="font-size:9px; margin-top:2px;">+${item.power} lực</span>`;
                        grid.appendChild(div);
                    });
                }
            }
        } else {
            document.getElementById('loginArea').style.display = 'block';
            document.getElementById('userProfileArea').style.display = 'none';
        }

        const list = document.getElementById('leaderboardList');
        list.innerHTML = '';
        const sorted = [...serverData.rankings].sort((a,b) => b.power - a.power);

        if (sorted.length === 0) {
            list.innerHTML = `<li style="text-align: center; color: var(--text-secondary); padding: 30px 10px; font-size: 13px;">Chưa có dữ liệu xếp hạng.</li>`;
            return;
        }

        sorted.forEach((user, index) => {
            let medal = `<span>#${index + 1}</span>`;
            if (index === 0) medal = '🥇';
            if (index === 1) medal = '🥈';
            if (index === 2) medal = '🥉';

            // Hiển thị tên tạm lấy từ ID hoặc ẩn danh, file JSON lưu trữ tuyệt đối chỉ lưu id
            const displayName = (currentUser && user.discord_id === currentUser.discord_id) ? currentUser.username : `Chiến Thần #${user.discord_id.slice(-4)}`;
            const displayAvatar = (currentUser && user.discord_id === currentUser.discord_id) ? currentUser.avatar : null;

            const li = document.createElement('li');
            li.className = 'leaderboard-item';
            li.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: #5865f2; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff;">
                        ${displayAvatar ? `<img src="${displayAvatar}" style="width:100%;height:100%;object-fit:cover;">` : '🎮'}
                    </div>
                    <div>
                        <strong class="rank-badge">${medal} ${displayName}</strong>
                        <div style="font-size: 11px; color: var(--text-secondary);">Rank: ${user.rank} | Đồ: ${user.items.length} món</div>
                    </div>
                </div>
                <div style="font-weight: bold; color: var(--primary);">${user.power} điểm</div>
            `;
            list.appendChild(li);
        });
    }

    loadData();
</script>

</body>
</html>
